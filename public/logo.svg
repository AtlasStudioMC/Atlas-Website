<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas Studio">
  <defs>
    <linearGradient id="mark" x1="24%" y1="4%" x2="86%" y2="98%">
      <stop offset="0%" stop-color="#c3ccff"/>
      <stop offset="28%" stop-color="#8e9cfb"/>
      <stop offset="62%" stop-color="#6470ee"/>
      <stop offset="100%" stop-color="#2f2a72"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f4fa"/>
      <stop offset="100%" stop-color="#a9b0c6"/>
    </linearGradient>
  </defs>

  <!-- Single filled glyph: down the right outer edge, up the inner edge, across the scoop,
       then straight back up the left outer edge to the apex. -->
  <path fill="url(#mark)" d="
    M 193 52
    L 210 52
    L 287 335
    Q 292 355 273 358
    Q 258 358 254 343
    L 228 247
    C 204 256 185 278 173 307
    L 160 343
    Q 155 358 140 358
    Q 121 358 127 335
    Z"/>

  <!-- Counter -->
  <path fill="#0b0f1e" fill-opacity="0" d="M 201 141 L 221 223 Q 200 233 184 248 Z"/>

  <!-- Light catch along the apex, as in the original mark -->
  <path stroke="url(#shine)" stroke-width="9" stroke-linecap="round" fill="none" d="M 206 57 L 238 173"/>
</svg>
